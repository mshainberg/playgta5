<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101513">
<title>San Andreas: Offline City</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#18211b}canvas{display:block}#world{width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}.panel{position:absolute;padding:10px 13px;background:#111b18dc;border:1px solid #ffffff2a;border-radius:9px;box-shadow:0 5px 20px #0006}#brand{top:14px;left:14px;font-weight:900;letter-spacing:.14em;font-size:13px}#brand small{display:block;color:#a8c5b2;font-size:9px;letter-spacing:.18em;margin-top:3px}#stats{right:14px;top:14px;min-width:145px;text-align:right;font-variant-numeric:tabular-nums}#cash{font-size:20px;font-weight:850;color:#85f0a3}#stars{color:#ffd75a;letter-spacing:3px;font-size:17px}#job{top:14px;left:50%;transform:translateX(-50%);min-width:220px;text-align:center}#job b{color:#ffe66d;font-size:10px;letter-spacing:.15em}#jobText{font-size:13px;margin-top:3px}#help{bottom:12px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);width:max-content;text-align:center;font-size:11px;line-height:1.6;color:#e5eee8}kbd{font:inherit;font-weight:800;border:1px solid #ffffff55;background:#ffffff17;border-radius:4px;padding:0 5px}#map{position:absolute;right:14px;bottom:14px;width:144px;height:108px;border:1px solid #ffffff70;border-radius:7px;background:#17231b}#toast{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);opacity:0;color:#ffe66d;font-size:clamp(18px,3vw,30px);font-weight:900;letter-spacing:.08em;text-align:center;transition:opacity .2s}.show{opacity:1!important}#touch{display:none;position:absolute;inset:auto 12px 130px;justify-content:space-between;pointer-events:auto}.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:4px}.pad button{border:1px solid #ffffff66;border-radius:10px;color:white;background:#17231bd9;font-size:18px;font-weight:800;touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.action{align-self:end;width:58px;height:58px;border-radius:50%;border:1px solid #ffffff80;background:#b88724dd;color:white;font-weight:900;touch-action:none}@media(max-width:650px){#job{top:74px}#map{width:108px;height:81px;right:9px;bottom:9px}#brand{top:9px;left:9px}#stats{top:9px;right:9px}#help{bottom:97px;font-size:10px}#touch{display:flex}}
</style>
</head>
<body>
<canvas id="world" aria-label="Top-down open-world city driving game"></canvas>
<div id="hud">
  <div id="brand" class="panel">SAN ANDREAS <small>OFFLINE CITY · ONE-FILE GAME</small></div>
  <div id="stats" class="panel"><div id="cash">$0</div><div id="stars">☆☆☆☆☆</div></div>
  <div id="job" class="panel"><b>STREET JOB</b><div id="jobText">Reach the gold marker</div></div>
  <div id="toast"></div>
  <canvas id="map" width="288" height="216" aria-label="Mini map"></canvas>
  <div id="help" class="panel"><kbd>WASD</kbd>/<kbd>↑↓←→</kbd> move · <kbd>E</kbd> enter/exit · <kbd>Shift</kbd> boost · <kbd>R</kbd> restart</div>
  <div id="touch"><div class="pad"><button class="up" data-key="w">▲</button><button class="left" data-key="a">◀</button><button class="down" data-key="s">▼</button><button class="right" data-key="d">▶</button></div><button class="action" data-key="e">E<br>CAR</button></div>
</div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),map=document.querySelector('#map'),mc=map.getContext('2d');
const cashEl=document.querySelector('#cash'),starsEl=document.querySelector('#stars'),jobEl=document.querySelector('#jobText'),toastEl=document.querySelector('#toast');
const W=2520,H=1890,ROAD=120,BLOCK=300,STEP=ROAD+BLOCK,keys=new Set(),camera={x:0,y:0};
let dpr=1,last=0,cash=0,wanted=0,heat=0,toastTime=0,job=0,seed=6251;
const player={x:ROAD/2,y:ROAD/2,angle:0,inCar:true};
const car={x:ROAD/2,y:ROAD/2,angle:0,speed:0,color:'#e34b3f',length:42,width:23};
const targets=[{x:STEP*5+ROAD/2,y:ROAD/2},{x:STEP*5+ROAD/2,y:STEP*3+ROAD/2},{x:STEP*2+ROAD/2,y:STEP*3+ROAD/2},{x:ROAD/2,y:STEP*2+ROAD/2},{x:STEP*3+ROAD/2,y:ROAD/2}];
const buildings=[],trees=[],traffic=[],cops=[];
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr)}addEventListener('resize',resize);resize();
function makeCity(){const palette=['#70776e','#817c70','#696f70','#8b8170','#626c67','#77766a'];for(let gx=-1;gx<7;gx++)for(let gy=-1;gy<5;gy++){let x=gx*STEP+ROAD+15,y=gy*STEP+ROAD+15;if(rand()<.15){for(let i=0;i<9;i++)trees.push({x:x+rand()*(BLOCK-25),y:y+rand()*(BLOCK-25),r:8+rand()*9});continue}for(let i=0,n=2+Math.floor(rand()*3);i<n;i++){let bw=48+rand()*92,bh=45+rand()*90;buildings.push({x:x+rand()*(BLOCK-bw-8),y:y+rand()*(BLOCK-bh-8),w:bw,h:bh,c:palette[Math.floor(rand()*palette.length)]})}}let colors=['#d7c36a','#5f9ac2','#cf7259','#79aa77','#b77aa8','#d6d5ca'];for(let i=0;i<24;i++)traffic.push({x:rand()*W,y:rand()*H,a:rand()*Math.PI*2,s:28+rand()*35,c:colors[i%colors.length]})}makeCity();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function say(s){toastEl.textContent=s;toastEl.classList.add('show');toastTime=2.1}function roadAt(x,y){let rx=((x%STEP)+STEP)%STEP,ry=((y%STEP)+STEP)%STEP;return rx<ROAD||ry<ROAD}
function blocked(x,y,r){return buildings.some(b=>x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)}
function setWanted(n){wanted=clamp(n,0,5);heat=12;starsEl.textContent='★'.repeat(wanted)+'☆'.repeat(5-wanted)}
function toggleCar(){if(player.inCar){player.inCar=false;player.x=clamp(car.x+Math.cos(car.angle+Math.PI/2)*34,8,W-8);player.y=clamp(car.y+Math.sin(car.angle+Math.PI/2)*34,8,H-8);say('ON FOOT')}else if(Math.hypot(player.x-car.x,player.y-car.y)<76){player.inCar=true;player.x=car.x;player.y=car.y;say('VEHICLE ENTERED')}else say('GET CLOSER TO YOUR CAR')}
function restart(){cash=0;wanted=0;heat=0;job=0;cops.length=0;car.x=ROAD/2;car.y=ROAD/2;car.angle=0;car.speed=0;player.x=car.x;player.y=car.y;player.angle=0;player.inCar=true;cashEl.textContent='$0';starsEl.textContent='☆☆☆☆☆';jobEl.textContent='Reach the gold marker';say('NEW SHIFT')}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k);if(k==='e'&&!e.repeat)toggleCar();if(k==='r'&&!e.repeat)restart()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);if(k==='e')toggleCar()});for(let t of ['pointerup','pointercancel','pointerleave'])b.addEventListener(t,()=>keys.delete(k))});
function update(dt){let up=keys.has('w')||keys.has('arrowup'),down=keys.has('s')||keys.has('arrowdown'),left=keys.has('a')||keys.has('arrowleft'),right=keys.has('d')||keys.has('arrowright');if(player.inCar){let boost=keys.has('shift')?1.45:1;car.speed+=(up?205:0)*dt;car.speed-=(down?255:0)*dt;car.speed*=Math.pow(up||down?.992:.974,dt*60);car.speed=clamp(car.speed,-100,300*boost);let steer=(right?1:0)-(left?1:0);car.angle+=steer*dt*(1.9+Math.min(Math.abs(car.speed)/110,1.6))*Math.sign(car.speed||1);let nx=car.x+Math.cos(car.angle)*car.speed*dt,ny=car.y+Math.sin(car.angle)*car.speed*dt;if(nx>20&&nx<W-20&&ny>20&&ny<H-20&&!blocked(nx,ny,13)){car.x=nx;car.y=ny}else car.speed*=-.22;player.x=car.x;player.y=car.y;player.angle=car.angle;if(!roadAt(car.x,car.y))car.speed*=Math.pow(.985,dt*60);if(Math.abs(car.speed)>215&&rand()<dt*.22&&!wanted)setWanted(1)}else{let dx=(right?1:0)-(left?1:0),dy=(down?1:0)-(up?1:0),len=Math.hypot(dx,dy)||1,pace=keys.has('shift')?225:145,nx=player.x+dx/len*pace*dt,ny=player.y+dy/len*pace*dt;if(!blocked(nx,ny,8)){player.x=clamp(nx,8,W-8);player.y=clamp(ny,8,H-8)}if(dx||dy)player.angle=Math.atan2(dy,dx);if(Math.hypot(player.x-car.x,player.y-car.y)<42&&Math.abs(car.speed)>35){setWanted(Math.max(1,wanted));car.speed*=.45}}
for(const t of traffic){t.x+=Math.cos(t.a)*t.s*dt;t.y+=Math.sin(t.a)*t.s*dt;if(t.x<0)t.x=W;if(t.x>W)t.x=0;if(t.y<0)t.y=H;if(t.y>H)t.y=0}
for(let i=cops.length-1;i>=0;i--){let c=cops[i],a=Math.atan2(player.y-c.y,player.x-c.x);c.x+=Math.cos(a)*c.s*dt;c.y+=Math.sin(a)*c.s*dt;if(Math.hypot(player.x-c.x,player.y-c.y)<22){setWanted(Math.max(1,wanted));cops.splice(i,1);say('POLICE CLOSE IN')}}if(wanted){heat-=dt;if(heat<=0){wanted--;heat=11;if(!wanted){cops.length=0;say('YOU LOST THE HEAT')}starsEl.textContent='★'.repeat(wanted)+'☆'.repeat(5-wanted)}if(cops.length<wanted&&rand()<dt*.55)cops.push({x:clamp(player.x+(rand()-.5)*650,20,W-20),y:clamp(player.y+(rand()-.5)*650,20,H-20),s:75+wanted*9})}
let target=targets[job%targets.length];if(Math.hypot(player.x-target.x,player.y-target.y)<52){cash+=250;job++;cashEl.textContent='$'+cash.toLocaleString();jobEl.textContent='Next drop: $250';say('JOB COMPLETE  +$250')}
camera.x=clamp(player.x-innerWidth/2,0,Math.max(0,W-innerWidth));camera.y=clamp(player.y-innerHeight/2,0,Math.max(0,H-innerHeight));if(toastTime>0&&((toastTime-=dt)<=0))toastEl.classList.remove('show')}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}function drawCar(c,x,y,a,color,l=42,w=23){c.save();c.translate(x,y);c.rotate(a);c.fillStyle='#141817';rr(c,-l/2-2,-w/2-3,l+4,w+6,7);c.fill();c.fillStyle=color;rr(c,-l/2,-w/2,l,w,6);c.fill();c.fillStyle='#b9d1c8';rr(c,-l*.13,-w*.36,l*.34,w*.72,4);c.fill();c.fillStyle='#ffe9a3';c.fillRect(l/2-4,-w/2+3,4,4);c.fillRect(l/2-4,w/2-7,4,4);c.restore()}
function draw(){let vw=innerWidth,vh=innerHeight;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,vw,vh);ctx.fillStyle='#59654f';ctx.fillRect(0,0,vw,vh);ctx.save();ctx.translate(-camera.x,-camera.y);ctx.fillStyle='#555953';for(let x=0;x<W;x+=STEP)ctx.fillRect(x,0,ROAD,H);for(let y=0;y<H;y+=STEP)ctx.fillRect(0,y,W,ROAD);ctx.strokeStyle='#c8b876';ctx.lineWidth=2;ctx.setLineDash([17,18]);for(let x=0;x<W;x+=STEP){ctx.beginPath();ctx.moveTo(x+ROAD/2,0);ctx.lineTo(x+ROAD/2,H);ctx.stroke()}for(let y=0;y<H;y+=STEP){ctx.beginPath();ctx.moveTo(0,y+ROAD/2);ctx.lineTo(W,y+ROAD/2);ctx.stroke()}ctx.setLineDash([]);
for(let b of buildings){ctx.fillStyle='#24292366';ctx.fillRect(b.x+7,b.y+9,b.w,b.h);ctx.fillStyle=b.c;rr(ctx,b.x,b.y,b.w,b.h,5);ctx.fill();ctx.fillStyle='#ffffff12';ctx.fillRect(b.x+8,b.y+8,b.w-16,4)}for(let t of trees){ctx.fillStyle='#283c2b';ctx.beginPath();ctx.arc(t.x+4,t.y+6,t.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#537a4d';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill()}for(let t of traffic)drawCar(ctx,t.x,t.y,t.a,t.c,36,18);for(let c of cops)drawCar(ctx,c.x,c.y,Math.atan2(player.y-c.y,player.x-c.x),'#eceee9',42,23);
let target=targets[job%targets.length],pulse=13+Math.sin(performance.now()/180)*4;ctx.strokeStyle='#ffe66d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(target.x,target.y,pulse,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(target.x,target.y,4,0,Math.PI*2);ctx.fill();if(player.inCar)drawCar(ctx,car.x,car.y,car.angle,car.color);else{ctx.fillStyle='#24221e';ctx.beginPath();ctx.arc(player.x,player.y,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#70d2ff';ctx.beginPath();ctx.arc(player.x,player.y,5,0,Math.PI*2);ctx.fill()}ctx.restore();drawMap()}
function drawMap(){let w=map.width,h=map.height;mc.clearRect(0,0,w,h);mc.fillStyle='#65725c';mc.fillRect(0,0,w,h);mc.fillStyle='#454c49';for(let x=0;x<W;x+=STEP)mc.fillRect(x/W*w,0,ROAD/W*w,h);for(let y=0;y<H;y+=STEP)mc.fillRect(0,y/H*h,w,ROAD/H*h);for(let t of targets){mc.fillStyle='#ffe66d';mc.fillRect(t.x/W*w-2,t.y/H*h-2,4,4)}for(let c of cops){mc.fillStyle='#fb5555';mc.fillRect(c.x/W*w-2,c.y/H*h-2,4,4)}mc.fillStyle='#63e4ff';mc.beginPath();mc.arc(player.x/W*w,player.y/H*h,4,0,Math.PI*2);mc.fill()}
function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
</body>
</html>
